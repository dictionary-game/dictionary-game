            href="data:application/json;base64,eyJuYW1lIjoiRGljdGlvbmFyeSBHYW1lIiwic2hvcnRfbmFtZSI6IkRpY3Rpb25hcnkiLCJkZXNjcmlwdGlvbiI6IkZhbWlseSBkaWN0aW9uYXJ5IHdvcmQgZ3Vlc3NpbmcgZ2FtZSBmb3Igcm9hZCB0cmlwcyIsInN0YXJ0X3VybCI6Ii8iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjZmZmZmZmIiwidGhlbWVfY29sb3IiOiIjN2MzYWVkIiwiaWNvbnMiOlt7InNyYyI6ImRhdGE6aW1hZ2Uvc3ZnK3htbDtiYXNlNjQsUEhOMlp5QjNhV1IwYUQwaU1USTRJaUJvWldsbmFIUTlJakV5T0NJZ2RtbGxkMEp2ZUQwaU1DQXdJREV5T0NBek1qQWlJSGh0Ykc1elBTSm9kSFJ3T2k4dmQzZDNMbmN6TG05eVp5OHlNREF3TDNOMlp5SStQSEpsWTNRZ2QybGtkR2c5SWpFeU9DSWdhR1ZwWjJoMFBTSXpNakFpSUhKNFBTSXhOQ0lnWm1sc2JEMGlJemRqTTJGbFpDSStQQzl5WldOMFBqeDBaWGgwSUhnOUlqWTBJaUI1UFNJeE1qQWlJR1pwYkd3OUluZG9hWFJsSWlCbWIyNTBMV1poYldsc2VUMGliVzl1YjNOd1lXTmxJaUIwWlhoMExXRnVZMmh2Y2owaWJXbGtaR3hsSWlCbWIyNTBMWE5wZW1VOUlqVTJJaUErOEorUXM4SjhaMnhsWXo5MGVYaDBQand2ZEdWNGRENGdQSE4yWnk0K0lnPT0iLCJzaXplcyI6IjEyOHgxMjgiLCJ0eXBlIjoiaW1hZ2Uvc3ZnK3htbCJ9XX0="

        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />

        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    Roboto, sans-serif;
                margin: 0;
                padding: 20px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }
            .game {
                max-width: 400px;
                margin: 0 auto;
                background: white;
                padding: 20px;
                border-radius: 15px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            }
            h1 {
                text-align: center;
                color: #7c3aed;
                margin-bottom: 20px;
                font-size: 28px;
            }
            input,
            button {
                padding: 14px;
                margin: 8px 0;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                width: 100%;
                box-sizing: border-box;
                -webkit-appearance: none;
            }
            button {
                background: #7c3aed;
                color: white;
                cursor: pointer;
                border: none;
                font-weight: 600;
                touch-action: manipulation;
            }
            button:hover,
            button:active {
                background: #6d28d9;
            }
            button:disabled {
                background: #9ca3af;
                cursor: not-allowed;
            }
            .word {
                padding: 15px;
                margin: 8px 0;
                border: 1px solid #e5e7eb;
                border-radius: 8px;
                cursor: pointer;
                touch-action: manipulation;
            }
            .word:hover,
            .word:active {
                background: #f3f4f6;
            }
            .install-prompt {
                background: #10b981;
                color: white;
                padding: 12px;
                border-radius: 8px;
                margin-bottom: 20px;
                text-align: center;
                font-weight: 600;
            }
            .install-prompt button {
                background: rgba(255, 255, 255, 0.2);
                border: 1px solid rgba(255, 255, 255, 0.3);
                color: white;
                margin: 8px 4px 0 4px;
                padding: 8px 16px;
                display: inline-block;
                width: auto;
            }
            .status {
                background: #dbeafe;
                padding: 10px;
                border-radius: 6px;
                margin: 10px 0;
                text-align: center;
                font-size: 14px;
            }
            @media (max-width: 480px) {
                body {
                    padding: 10px;
                }
                .game {
                    padding: 15px;
                }
                h1 {
                    font-size: 24px;
                }
            }
        </style>
    </head>
    <body>
        <div class="game">
            <div
                id="installPrompt"
                class="install-prompt"
                style="display: none"
            >
                <div>📱 Install this game on your phone!</div>
                <button onclick="installApp()">Install App</button>
                <button onclick="hideInstallPrompt()">Maybe Later</button>
            </div>

            <h1>📖 Dictionary Game</h1>

            <div id="status" class="status" style="display: none"></div>

            <div id="content">
                <p>Add players to start:</p>
                <input
                    type="text"
                    id="playerName"
                    placeholder="Enter player name"
                />
                <button onclick="addPlayer()">Add Player</button>
                <div id="players"></div>
            </div>
        </div>

        <script>
            // PWA Installation
            let deferredPrompt;
            let isInstalled = false;

            // Check if app is already installed
            window.addEventListener("beforeinstallprompt", (e) => {
                e.preventDefault();
                deferredPrompt = e;
                showInstallPrompt();
            });

            // Check if launched from home screen
            window.addEventListener("appinstalled", () => {
                hideInstallPrompt();
                showStatus("App installed successfully! 🎉");
                isInstalled = true;
            });

            // Check if running as PWA
            if (
                window.matchMedia("(display-mode: standalone)").matches ||
                window.navigator.standalone
            ) {
                isInstalled = true;
            }

            function showInstallPrompt() {
                if (!isInstalled) {
                    document.getElementById("installPrompt").style.display =
                        "block";
                }
            }

            function hideInstallPrompt() {
                document.getElementById("installPrompt").style.display = "none";
            }

            function installApp() {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === "accepted") {
                            showStatus("Installing app...");
                        }
                        deferredPrompt = null;
                        hideInstallPrompt();
                    });
                }
            }

            function showStatus(message) {
                const status = document.getElementById("status");
                status.textContent = message;
                status.style.display = "block";
                setTimeout(() => {
                    status.style.display = "none";
                }, 3000);
            }

            // Service Worker for offline functionality
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    const swCode = `
                    const CACHE_NAME = 'dictionary-game-v1';
                    const urlsToCache = ['/'];
                    
                    self.addEventListener('install', (event) => {
                        event.waitUntil(
                            caches.open(CACHE_NAME)
                                .then((cache) => cache.addAll(urlsToCache))
                        );
                    });
                    
                    self.addEventListener('fetch', (event) => {
                        event.respondWith(
                            caches.match(event.request)
                                .then((response) => {
                                    return response || fetch(event.request);
                                })
                        );
                    });
                `;

                    const blob = new Blob([swCode], {
                        type: "application/javascript",
                    });
                    const swUrl = URL.createObjectURL(blob);

                    navigator.serviceWorker
                        .register(swUrl)
                        .then(() => {
                            showStatus("Game ready for offline use! 📶");
                        })
                        .catch(() => {
                            console.log("Service worker registration failed");
                        });
                });
            }

            // Game Logic
            let players = [];
            let currentPlayer = 0;
            let gamePhase = "setup";
            let selectedWord = null;

            const words = [
                {
                    word: "apple",
                    def: "Red or green fruit that grows on trees",
                },
                {
                    word: "elephant",
                    def: "Large gray animal with trunk and big ears",
                },
                {
                    word: "bicycle",
                    def: "Two-wheeled vehicle you pedal with your feet",
                },
                {
                    word: "rainbow",
                    def: "Colorful arc that appears in sky after rain",
                },
                {
                    word: "chocolate",
                    def: "Sweet brown candy made from cocoa beans",
                },
                { word: "butterfly", def: "Flying insect with colorful wings" },
                {
                    word: "computer",
                    def: "Electronic device for processing information",
                },
                { word: "volcano", def: "Mountain that can erupt with lava" },
                {
                    word: "basketball",
                    def: "Sport where you shoot ball through hoops",
                },
                {
                    word: "waterfall",
                    def: "Water falling down from high place",
                },
                {
                    word: "telescope",
                    def: "Tool to see stars and planets far away",
                },
                { word: "adventure", def: "Exciting journey with some danger" },
                {
                    word: "friendship",
                    def: "Close caring relationship between people",
                },
                {
                    word: "detective",
                    def: "Person who solves crimes and mysteries",
                },
                { word: "submarine", def: "Ship that travels underwater" },
                {
                    word: "guitar",
                    def: "Musical instrument with strings you strum",
                },
                { word: "mountain", def: "Very tall hill or peak" },
                { word: "dragon", def: "Mythical fire-breathing creature" },
                { word: "library", def: "Building filled with books to read" },
                { word: "ocean", def: "Large body of salt water" },
            ];

            function addPlayer() {
                const input = document.getElementById("playerName");
                const name = input.value.trim();
                if (name && players.length < 6) {
                    players.push({ name: name, score: 0 });
                    input.value = "";
                    updateDisplay();
                }
            }

            function removePlayer(index) {
                players.splice(index, 1);
                updateDisplay();
            }

            function startGame() {
                if (players.length >= 2) {
                    gamePhase = "browse";
                    updateDisplay();
                }
            }

            function selectWord(word) {
                selectedWord = word;
                gamePhase = "clue";
                updateDisplay();
            }

            function showDefinition() {
                gamePhase = "guess";
                updateDisplay();
            }

            function submitGuess() {
                const input = document.getElementById("guessInput");
                const guess = input.value.trim().toLowerCase();

                if (guess === selectedWord.word.toLowerCase()) {
                    players[currentPlayer].score++;
                    showStatus(
                        players[currentPlayer].name + " got it right! 🎉",
                    );
                } else {
                    currentPlayer = (currentPlayer + 1) % players.length;
                    showStatus(
                        "Wrong! " +
                            players[currentPlayer].name +
                            "'s turn now.",
                    );
                }

                gamePhase = "browse";
                setTimeout(updateDisplay, 1500);
            }

            function updateDisplay() {
                const content = document.getElementById("content");

                if (gamePhase === "setup") {
                    let html = "<p>Add players to start:</p>";
                    html +=
                        '<input type="text" id="playerName" placeholder="Enter player name">';
                    html += '<button onclick="addPlayer()">Add Player</button>';
                    html += '<div id="players">';

                    players.forEach((player, i) => {
                        html +=
                            '<div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:#f8f9fa; margin:5px 0; border-radius:8px;">';
                        html +=
                            '<span style="font-weight:600;">' +
                            player.name +
                            "</span>";
                        html +=
                            '<button onclick="removePlayer(' +
                            i +
                            ')" style="background:#ef4444; width:auto; padding:5px 10px; margin:0;">×</button>';
                        html += "</div>";
                    });

                    html += "</div>";

                    if (players.length >= 2) {
                        html +=
                            '<button onclick="startGame()" style="background:#10b981; margin-top:15px;">🎮 Start Game</button>';
                    } else if (players.length > 0) {
                        html +=
                            '<p style="text-align:center; color:#666; margin-top:15px;">Add one more player to start</p>';
                    }

                    content.innerHTML = html;
                } else if (gamePhase === "browse") {
                    let html =
                        '<h3 style="text-align:center; margin-bottom:20px;">' +
                        players[currentPlayer].name +
                        ", choose your word!</h3>";
                    html +=
                        '<div style="max-height:350px; overflow-y:auto; border:1px solid #e5e7eb; border-radius:8px; padding:10px;">';

                    words.forEach((word) => {
                        html +=
                            '<div class="word" onclick="selectWord({word:\'' +
                            word.word +
                            "', def:'" +
                            word.def +
                            "'})\">";
                        html +=
                            '<div style="font-weight:bold; font-size:18px; color:#7c3aed;">' +
                            word.word +
                            "</div>";
                        html +=
                            '<div style="color:#666; font-size:14px; margin-top:4px;">' +
                            word.def +
                            "</div>";
                        html += "</div>";
                    });

                    html += "</div>";
                    content.innerHTML = html;
                } else if (gamePhase === "clue") {
                    let html =
                        '<h3 style="text-align:center;">' +
                        players[currentPlayer].name +
                        "'s Turn</h3>";
                    html +=
                        '<div style="background:#fef3c7; padding:20px; border-radius:12px; text-align:center; margin:20px 0; border:2px solid #f59e0b;">';
                    html +=
                        '<div style="font-size:18px; font-weight:bold; color:#92400e;">Word Clue:</div>';
                    html +=
                        '<div style="font-size:20px; font-weight:bold; margin-top:8px;">Starts with "' +
                        selectedWord.word[0].toUpperCase() +
                        '" and ends with "' +
                        selectedWord.word[
                            selectedWord.word.length - 1
                        ].toLowerCase() +
                        '"</div>';
                    html += "</div>";
                    html +=
                        '<button onclick="showDefinition()" style="background:#3b82f6; font-size:18px;">📖 Show Definition</button>';
                    content.innerHTML = html;
                } else if (gamePhase === "guess") {
                    let html =
                        '<h3 style="text-align:center;">Time to Guess!</h3>';
                    html +=
                        '<div style="background:#dbeafe; padding:20px; border-radius:12px; margin:20px 0; border:2px solid #3b82f6;">';
                    html +=
                        '<div style="font-size:18px; font-weight:bold; color:#1e40af; margin-bottom:10px;">Definition:</div>';
                    html +=
                        '<div style="font-size:16px; font-weight:500;">' +
                        selectedWord.def +
                        "</div>";
                    html += "</div>";
                    html +=
                        '<input type="text" id="guessInput" placeholder="Type your guess..." style="margin-bottom:15px; font-size:18px;">';
                    html +=
                        '<button onclick="submitGuess()" style="background:#10b981; font-size:18px;">✅ Submit Guess</button>';
                    content.innerHTML = html;

                    // Focus on input
                    setTimeout(() => {
                        const input = document.getElementById("guessInput");
                        if (input) input.focus();
                    }, 100);
                }

                // Add scores at top if game started
                if (gamePhase !== "setup") {
                    let scoreHtml =
                        '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; margin-bottom:25px;">';
                    players.forEach((player, i) => {
                        scoreHtml +=
                            '<div style="text-align:center; padding:12px; border-radius:12px; ' +
                            (i === currentPlayer
                                ? "background:#e0e7ff; border:3px solid #7c3aed;"
                                : "background:#f8f9fa; border:1px solid #e5e7eb;") +
                            '">';
                        scoreHtml +=
                            '<div style="font-weight:bold; font-size:14px;">' +
                            player.name +
                            "</div>";
                        scoreHtml +=
                            '<div style="font-size:28px; font-weight:bold; color:#7c3aed;">' +
                            player.score +
                            "</div>";
                        scoreHtml += "</div>";
                    });
                    scoreHtml += "</div>";
                    content.innerHTML = scoreHtml + content.innerHTML;
                }
            }

            // Initialize
            updateDisplay();

            // Add Enter key support
            document.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    if (
                        gamePhase === "setup" &&
                        document.getElementById("playerName")
                    ) {
                        addPlayer();
                    } else if (
                        gamePhase === "guess" &&
                        document.getElementById("guessInput")
                    ) {
                        submitGuess();
                    }
                }
            });

            // Prevent zoom on double tap
            let lastTouchEnd = 0;
            document.addEventListener(
                "touchend",
                function (event) {
                    const now = new Date().getTime();
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault();
                    }
                    lastTouchEnd = now;
                },
                false,
            );
        </script>
    </body>
</html>
